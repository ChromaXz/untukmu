<!DOCTYPE html>
<html>
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .title {
            text-align: center;
            margin: 20px 0;
            font-family: Arial, sans-serif;
            color: #2196F3;
        }
        .container {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .switch-card {
            width: 180px;
            margin: 10px;
            text-align: center;
        }

        .image-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            transition: .4s;
        }

        .image-container.active img {
            opacity: 1;
        }

        .form-check-input {
            height: 25px !important;
            width: 45px !important;
        }

        .switch-label {
            margin-top: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .form-switch {
            padding-left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-switch .form-check-input {
            margin-left: 0;
        }

        /* Status display untuk debugging */
        .status-display {
            margin-top: 20px;
            text-align: center;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1 class="title">Ketika AKAD mau ngumpul</h1>
    <div class="container">
        <div class="switch-card">
            <div class="image-container" id="image0">
                <img src="dode.jpg" alt="Image A">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switch0" onchange="handleSwitch(0)">
            </div>
            <div class="switch-label">Dode</div>
        </div>
        <div class="switch-card">
            <div class="image-container" id="image1">
                <img src="ardha.jpg" alt="Image B">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switch1" onchange="handleSwitch(1)">
            </div>
            <div class="switch-label">Ardha</div>
        </div>
        <div class="switch-card">
            <div class="image-container" id="image2">
                <img src="alfian.jpg" alt="Image C">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switch2" onchange="handleSwitch(2)">
            </div>
            <div class="switch-label">Alfian</div>
        </div>
        <div class="switch-card">
            <div class="image-container" id="image3">
                <img src="komang.jpg" alt="Image D">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switch3" onchange="handleSwitch(3)">
            </div>
            <div class="switch-label">Komang</div>
        </div>
    </div>

    <!-- Status display untuk melihat status switch -->
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        const switches = document.querySelectorAll('.form-check-input');
        const imageContainers = document.querySelectorAll('.image-container');
        let activeSwitches = [false, false, false, false];
        let activeOrder = []; // Menyimpan urutan switch yang aktif

        function updateStatusDisplay() {
            document.getElementById('activeStatus').textContent = 
                `Active switches: ${activeOrder.join(', ')}`;
            document.getElementById('switchStatus').textContent = 
                `Switch status: ${activeSwitches.map((s, i) => `${i}:${s}`).join(' ')}`;
        }

        function handleSwitch(index) {
            const isChecked = switches[index].checked;
            
            if (isChecked) {
                // Jika switch dinyalakan
                if (activeOrder.length >= 3) {
                    // Jika sudah ada 3 switch aktif, matikan yang paling lama aktif
                    const oldestActiveIndex = activeOrder[0];
                    switches[oldestActiveIndex].checked = false;
                    imageContainers[oldestActiveIndex].classList.remove('active');
                    activeSwitches[oldestActiveIndex] = false;
                    activeOrder.shift(); // Hapus switch terlama
                }
                
                // Aktifkan switch baru
                activeSwitches[index] = true;
                imageContainers[index].classList.add('active');
                activeOrder.push(index); // Tambahkan ke urutan aktif
            } else {
                // Jika switch dimatikan
                activeSwitches[index] = false;
                imageContainers[index].classList.remove('active');
                // Hapus dari urutan aktif
                const orderIndex = activeOrder.indexOf(index);
                if (orderIndex > -1) {
                    activeOrder.splice(orderIndex, 1);
                }
            }

            updateStatusDisplay(); // Update display status
        }

        // Initialize status display
        updateStatusDisplay();
    </script>
</body>
</html>
